[package]
name = "loretta-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Ported Loretta unit tests (Compilers/Lua/Test/Portable b767b4e) — Oracle 1 case tables"

[dependencies]
loretta = { path = "../loretta" }
full_moon = { version = "2.2.0", features = ["luau", "lua52", "lua53", "lua54", "luajit", "cfxlua"] }

