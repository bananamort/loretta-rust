[[test]]
name = "objectdisplay_tests"
path = "objectdisplay_tests.rs"

[[test]]
name = "constantfolder_tests"
path = "constantfolder_tests.rs"

[[test]]
name = "experimental_regression_tests"
path = "experimental_regression_tests.rs"

[[test]]
name = "lexical_error_tests"
path = "lexical_error_tests.rs"

[[test]]
name = "lexical_tests"
path = "lexical_tests.rs"

[[test]]
name = "lexical_regression_tests"
path = "lexical_regression_tests.rs"

[[test]]
name = "binary_operator_precedence_tests"
path = "binary_operator_precedence_tests.rs"

[[test]]
