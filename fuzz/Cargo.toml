[package]
name = "loretta-fuzz"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fuzz targets for Loretta-RS (standalone, nightly soak)"

[workspace]

[dependencies]
full_moon = { path = "../references/full-moon/full-moon", features = ["luau", "lua52", "lua53", "lua54", "luajit", "cfxlua"] }

[features]
default = []

[[bin]]
name = "compile"
path = "fuzz_targets/compile.rs"
[[bin]]
name = "run"
path = "fuzz_targets/run.rs"
[[bin]]
name = "typeck"
path = "fuzz_targets/typeck.rs"
[[bin]]
name = "number"
path = "fuzz_targets/number.rs"
[[bin]]
name = "structured"
path = "fuzz_targets/structured.rs"
[[bin]]
name = "typeck_defs"
path = "fuzz_targets/typeck_defs.rs"
[[bin]]
name = "determinism"
path = "fuzz_targets/determinism.rs"
[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
[[bin]]
name = "splice"
path = "fuzz_targets/splice.rs"
[[bin]]
name = "optdiff"
path = "fuzz_targets/optdiff.rs"
[[bin]]
name = "metamorphic"
path = "fuzz_targets/metamorphic.rs"
[[bin]]
name = "spans"
path = "fuzz_targets/spans.rs"
[[bin]]
name = "api"
path = "fuzz_targets/api.rs"
[[bin]]
name = "gcstress"
path = "fuzz_targets/gcstress.rs"
[[bin]]
name = "host"
path = "fuzz_targets/host.rs"
[[bin]]
name = "serde_roundtrip"
path = "fuzz_targets/serde_roundtrip.rs"
