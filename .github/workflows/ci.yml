name: CI
on:
  pull_request:
    paths:
      - "loretta-rs/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "loretta-rs"
      - name: cargo check --workspace --all-features
        working-directory: loretta-rs
        run: cargo check --workspace --all-features --locked
      - name: cargo clippy --workspace --all-features
        working-directory: loretta-rs
        run: cargo clippy --workspace --all-features --locked -- -D warnings
      - name: cargo fmt --check
        working-directory: loretta-rs
        run: cargo fmt --all --check
      - name: cargo test --workspace --all-features
        working-directory: loretta-rs
        run: cargo test --workspace --all-features --locked
      - name: Drift check
        working-directory: loretta-rs
        run: |
          echo "Drift check: every public member exists or is documented as DROP; no todo!/unimplemented!/mod deletions"
          python3 - << 'PY'
          import json, pathlib, sys
          nodes = json.loads(pathlib.Path("nodes.json").read_text())
          topo = json.loads(pathlib.Path("topo.json").read_text())
          edges = json.loads(pathlib.Path("edges.json").read_text())
          if len(nodes) != len(topo):
              print(f"FAIL: nodes.json {len(nodes)} != topo.json {len(topo)}")
              sys.exit(1)
          if len(set(n["Id"] for n in nodes)) != len(nodes):
              print("FAIL: duplicate Ids in nodes.json")
              sys.exit(1)
          print(f"Drift OK: {len(nodes)} nodes, {len(edges)} edges, topo {len(topo)}")
          prog = pathlib.Path("PROGRESS.md").read_text()
          rows = len([l for l in prog.splitlines() if l.startswith("| ") and " | pending | " in l or " | done | " in l or " | claimed | " in l])
          if rows != len(nodes):
              print(f"WARN: PROGRESS.md rows {rows} != nodes {len(nodes)} (may be pending work)")
          else:
              print(f"PROGRESS rows OK: {rows}")
          PY
      - name: C# oracle (strict per-feature)
        if: ${{ hashFiles('references/Loretta/**/*.csproj') != '' }}
        run: |
          dotnet --info | head -n 5
          NUGET_PACKAGES=/tmp/loretta-differential-packages dotnet build loretta-rs/tools/differential/Differential.csproj -c Release
          dotnet run --project loretta-rs/tools/differential/Differential.csproj -c Release --no-build -- diagnostics All "local a=1" | head -n 20
          ls -lh loretta-rs/corpus/expected/All/anim/ | head -n 20
          test -f loretta-rs/corpus/expected/All/anim/diagnostics.json
          echo "C# oracle OK — expected per AllPresets for corpus + features"
      - name: Differential smoke (corpus + expected)
        if: ${{ hashFiles('references/Loretta/**/*.csproj') != '' }}
        working-directory: loretta-rs
        run: |
          ls -lh corpus/expected/All/anim/ | head -n 20
          test -f corpus/expected/All/anim/parse.json
          echo "Differential harness — C# expected present, Rust oracle to be built by agents per loretta-rs/tools/differential/README.md"
      - name: Oracle2 status
        if: ${{ hashFiles('references/Loretta/**/*.csproj') == '' }}
        run: echo "C# oracle skipped — references/ not available (gitignored). Oracle2 runs locally."
