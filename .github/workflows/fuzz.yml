name: Fuzz (long soak)
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      iters_per_target:
        description: "Pseudo-random inputs per target"
        required: false
        default: "50000"
concurrency:
  group: fuzz-soak
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  soak:
    name: soak ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [compile, run, typeck, typeck_defs, number, structured, determinism, roundtrip, splice, optdiff, metamorphic, spans, api, gcstress, host, serde_roundtrip]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo + fuzz build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz"
      - name: Build standalone target
        working-directory: fuzz
        run: cargo build --bins
      - name: Soak
        working-directory: fuzz
        env:
          LORETTA_FUZZ_SEED: ${{ github.run_id }}
          LORETTA_FUZZ_ITERS: ${{ github.event.inputs.iters_per_target || '50000' }}
        run: |
          echo "Soaking '${{ matrix.target }}' for ${LORETTA_FUZZ_ITERS} inputs (seed ${LORETTA_FUZZ_SEED})"
          ./target/debug/${{ matrix.target }}
